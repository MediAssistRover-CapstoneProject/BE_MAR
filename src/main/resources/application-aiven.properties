# Additional profile: BE stays on the laptop; only MySQL moves to Aiven.
spring.datasource.url=${AIVEN_DB_URL}
spring.datasource.username=${AIVEN_DB_USERNAME}
spring.datasource.password=${AIVEN_DB_PASSWORD}
spring.datasource.hikari.data-source-properties.sslMode=VERIFY_IDENTITY
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=${AIVEN_DB_TRUSTSTORE_URL:file:/run/secrets/aiven/truststore.p12}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=PKCS12
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=${AIVEN_DB_TRUSTSTORE_PASSWORD}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
# Both map bytes and catalog metadata use Aiven. RAM caches are disposable.
app.mapping.storage-backend=DATABASE
