# Production must receive every secret and endpoint from the deployment environment.
# Start Railway with SPRING_PROFILES_ACTIVE=prod.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

app.jwt.secret=${JWT_SECRET}
app.device-jwt.secret=${DEVICE_JWT_SECRET}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

app.bootstrap.admin-username=${ADMIN_USERNAME}
app.bootstrap.admin-password=${ADMIN_PASSWORD}
app.bootstrap.admin-email=${ADMIN_EMAIL}
app.bootstrap.admin-account-code=${ADMIN_ACCOUNT_CODE}
app.bootstrap.admin-full-name=${ADMIN_FULL_NAME}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
