<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Local ROS Map Preview</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f7fb}body{margin:0;padding:28px}
    main{max-width:1100px;margin:auto}.card{background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 8px 30px #2030500d}
    h1{margin:0 0 8px;font-size:25px}p{color:#596780}label{display:block;font-weight:650;margin:12px 0 6px}input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #bbc8da;border-radius:8px}
    button{margin-top:16px;padding:11px 18px;border:0;border-radius:8px;background:#2869e8;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.55}
    #status{white-space:pre-wrap;margin-top:12px}.error{color:#b42318}.ok{color:#067647}.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr);gap:18px}
    .viewer{min-height:500px;display:grid;place-items:center;background:#e9eef5;border-radius:10px;overflow:auto;background-image:linear-gradient(#dce4ef 1px,transparent 1px),linear-gradient(90deg,#dce4ef 1px,transparent 1px);background-size:24px 24px}
    img{max-width:100%;image-rendering:pixelated;border:1px solid #708199;background:white}pre{overflow:auto;font-size:12px;line-height:1.55}.hidden{display:none}
    @media(max-width:800px){.grid{grid-template-columns:1fr}body{padding:14px}}
  </style>
</head>
<body><main>
  <section class="card">
    <h1>Preview map.yaml + map.pgm</h1>
    <p>Chỉ đọc và render trong bộ nhớ. Không ghi MySQL, không upload S3. API vẫn yêu cầu ADMIN/STAFF JWT.</p>
    <label>JWT access token</label><input id="token" type="password" placeholder="Dán token, không cần chữ Bearer">
    <label>Map ID (không bắt buộc)</label><input id="mapId" placeholder="UUID để đối chiếu hash và geometry trong DB">
    <label>map.yaml</label><input id="yaml" type="file" accept=".yaml,.yml,text/yaml">
    <label>map.pgm</label><input id="pgm" type="file" accept=".pgm,image/x-portable-graymap">
    <button id="preview">Đọc metadata và tạo ảnh</button><div id="status"></div>
  </section>
  <section id="result" class="grid hidden">
    <div class="card viewer"><img id="image" alt="Map preview"></div>
    <div class="card"><h2>Kết quả</h2><pre id="metadata"></pre></div>
  </section>
</main><script>
const byId=id=>document.getElementById(id);
byId('preview').onclick=async()=>{
  const button=byId('preview'),status=byId('status');status.className='';status.textContent='';
  const yaml=byId('yaml').files[0],pgm=byId('pgm').files[0],token=byId('token').value.trim();
  if(!yaml||!pgm||!token){status.className='error';status.textContent='Cần JWT, map.yaml và map.pgm.';return}
  const form=new FormData();form.append('yaml',yaml);form.append('pgm',pgm);
  if(byId('mapId').value.trim())form.append('mapId',byId('mapId').value.trim());
  button.disabled=true;status.textContent='Đang kiểm tra và render...';
  try{
    const response=await fetch('/api/v1/maps/local-preview',{method:'POST',headers:{Authorization:'Bearer '+token},body:form});
    const body=await response.json();if(!response.ok)throw new Error(body.message||('HTTP '+response.status));
    byId('image').src=body.imageDataUrl;
    const visible={mapId:body.mapId,catalogFound:body.catalogFound,assetHashMatches:body.assetHashMatches,geometryMatches:body.geometryMatches,assetHash:body.assetHash,metadata:body.metadata};
    byId('metadata').textContent=JSON.stringify(visible,null,2);byId('result').classList.remove('hidden');
    status.className='ok';status.textContent='Render thành công.'+(body.mapId&&!body.catalogFound?' Map ID không tồn tại trong DB.':'');
  }catch(error){status.className='error';status.textContent=error.message}finally{button.disabled=false}
};
</script></body></html>
