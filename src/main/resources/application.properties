spring.application.name=mediassist-rover-backend

# =========================
# JWT - STAFF / ADMIN
# =========================
app.jwt.secret=${JWT_SECRET:mediassist-rover-jwt-secret-key-2026-very-long-secret}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.jwt.issuer=${JWT_ISSUER:mediassist-rover}

# =========================
# JWT - DEVICE / ROBOT
# =========================
app.device-jwt.secret=${DEVICE_JWT_SECRET:mediassist-rover-device-jwt-secret-key-2026-very-long-secret}
app.device-jwt.expiration-ms=${DEVICE_JWT_EXPIRATION_MS:3600000}
app.device-jwt.issuer=${DEVICE_JWT_ISSUER:mediassist-rover-device}

# =========================
# PUBLIC / CORS
# =========================
app.public.base-url=${PUBLIC_BASE_URL:/}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# =========================
# BOOTSTRAP ADMIN
# =========================
app.bootstrap.admin-username=${ADMIN_USERNAME:admin}
app.bootstrap.admin-password=${ADMIN_PASSWORD:Admin@123456}
app.bootstrap.admin-email=${ADMIN_EMAIL:admin@mediassist.local}
app.bootstrap.admin-account-code=${ADMIN_ACCOUNT_CODE:ADMIN001}
app.bootstrap.admin-full-name=${ADMIN_FULL_NAME:System Administrator}

# =========================
# AUTH
# =========================
app.auth.max-failed-login-attempts=${MAX_FAILED_LOGIN_ATTEMPTS:5}
app.auth.temporary-lock-minutes=${TEMPORARY_LOCK_MINUTES:15}

# =========================
# OPERATIONS
# =========================
app.operations.scheduler-enabled=${OPERATIONS_SCHEDULER_ENABLED:true}
app.operations.robot-offline-threshold-seconds=${ROBOT_OFFLINE_THRESHOLD_SECONDS:30}
app.operations.robot-offline-scan-ms=${ROBOT_OFFLINE_SCAN_MS:10000}
app.operations.schedule-scan-ms=${SCHEDULE_SCAN_MS:10000}
app.operations.job-overdue-scan-ms=${JOB_OVERDUE_SCAN_MS:10000}
app.operations.step-timeout-scan-ms=${STEP_TIMEOUT_SCAN_MS:5000}
app.operations.token-cleanup-ms=${TOKEN_CLEANUP_MS:3600000}

# =========================
# DATABASE
# =========================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/backend_robot_v1}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}

# =========================
# FLYWAY
# =========================
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=BINARY
spring.jpa.open-in-view=false

# =========================
# JACKSON
# =========================
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# =========================
# SWAGGER / OPENAPI
# =========================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# =========================
# ACTUATOR
# =========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# =========================
# SERVER
# =========================
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=framework