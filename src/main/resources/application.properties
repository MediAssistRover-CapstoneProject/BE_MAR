spring.application.name=mediassist-rover-backend

# AMAZON S3
app.aws.s3.region=${AWS_REGION:ap-southeast-1}
app.aws.s3.bucket=${AWS_S3_BUCKET}
spring.config.import=optional:file:.env[.properties]

# =========================
# JWT - STAFF / ADMIN
# =========================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.jwt.issuer=${JWT_ISSUER:mediassist-rover}

# =========================
# JWT - DEVICE / ROBOT
# =========================
app.device-jwt.secret=${DEVICE_JWT_SECRET}
app.device-jwt.expiration-ms=${DEVICE_JWT_EXPIRATION_MS:3600000}
app.device-jwt.issuer=${DEVICE_JWT_ISSUER:mediassist-rover-device}

# =========================
# DELIVERY QR CHALLENGE
# =========================
app.qr-challenge.secret=${QR_CHALLENGE_SECRET:change-me-qr-challenge-secret-at-least-32}
app.qr-challenge.ttl-seconds=${QR_CHALLENGE_TTL_SECONDS:120}

# =========================
# PUBLIC / CORS
# =========================
app.public.base-url=${PUBLIC_BASE_URL:/}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# =========================
# BOOTSTRAP ADMIN
# =========================
# Leave all five values empty to skip bootstrap, or provide all five through environment variables.
app.bootstrap.admin-username=${ADMIN_USERNAME:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-account-code=${ADMIN_ACCOUNT_CODE:}
app.bootstrap.admin-full-name=${ADMIN_FULL_NAME:}

# =========================
# AUTH
# =========================
app.auth.max-failed-login-attempts=${MAX_FAILED_LOGIN_ATTEMPTS:5}
app.auth.temporary-lock-minutes=${TEMPORARY_LOCK_MINUTES:15}

# =========================
# OPERATIONS
# =========================
app.operations.scheduler-enabled=${OPERATIONS_SCHEDULER_ENABLED:true}
app.operations.robot-offline-threshold-seconds=${ROBOT_OFFLINE_THRESHOLD_SECONDS:30}
app.operations.robot-pose-freshness-seconds=${ROBOT_POSE_FRESHNESS_SECONDS:5}
app.operations.robot-offline-scan-ms=${ROBOT_OFFLINE_SCAN_MS:10000}
app.operations.schedule-scan-ms=${SCHEDULE_SCAN_MS:10000}
app.operations.job-overdue-scan-ms=${JOB_OVERDUE_SCAN_MS:10000}
app.operations.step-timeout-scan-ms=${STEP_TIMEOUT_SCAN_MS:5000}
app.operations.token-cleanup-ms=${TOKEN_CLEANUP_MS:3600000}
app.operations.retention-scan-cron=${RETENTION_SCAN_CRON:0 30 2 * * *}
app.operations.retention-enabled=${RETENTION_ENABLED:false}
app.operations.retention-dry-run=${RETENTION_DRY_RUN:true}
app.operations.retention-batch-size=${RETENTION_BATCH_SIZE:200}
app.operations.retention-max-batches=${RETENTION_MAX_BATCHES:10}

# =========================
# DATABASE
# =========================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/backend_robot_v1}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}

# =========================
# FLYWAY
# =========================
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=BINARY
spring.jpa.open-in-view=false

# =========================
# JACKSON
# =========================
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# =========================
# SWAGGER / OPENAPI
# =========================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# =========================
# ACTUATOR
# =========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# SMTP is an optional notification channel. A temporary Gmail/network outage must
# not mark the whole API DOWN or trigger the deployment rollback health check.
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}

# =========================
# REPORTS
# =========================
app.reports.export-max-rows=${REPORT_EXPORT_MAX_ROWS:5000}

# =========================
# SERVER
# =========================
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=framework
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:21MB}

# MQTT 5 transport is opt-in; broker credentials and enrollment come from deployment.
app.mqtt.enabled=${MQTT_ENABLED:false}
app.mqtt.dispatch-enabled=${MQTT_DISPATCH_ENABLED:false}
app.mqtt.broker-uri=${MQTT_BROKER_URI:ssl://localhost:8883}
app.mqtt.client-id=${MQTT_CLIENT_ID:mar-be-mqtt}
app.mqtt.username=${MQTT_USERNAME:}
app.mqtt.password=${MQTT_PASSWORD:}
app.mqtt.robot-ids=${MQTT_ROBOT_IDS:}
app.mqtt.enabled-step-types=${MQTT_ENABLED_STEP_TYPES:MOVE,CONTROL_HARDWARE,EXECUTE_SENSING,WAIT}
app.mqtt.allow-simulation=${MQTT_ALLOW_SIMULATION:false}
app.mqtt.command-ttl-sec=${MQTT_COMMAND_TTL_SEC:30}
app.mqtt.retry-interval-sec=${MQTT_RETRY_INTERVAL_SEC:8}

# Mapping stays opt-in until Pi SLAM/upload capabilities are commissioned.
app.mapping.enabled=${MAPPING_ENABLED:false}
app.mapping.storage-dir=${MAPPING_STORAGE_DIR:./data/map-artifacts}
app.mapping.storage-backend=${MAPPING_STORAGE_BACKEND:FILESYSTEM}
app.mapping.max-archive-bytes=${MAPPING_MAX_ARCHIVE_BYTES:16777216}
app.mapping.max-uncompressed-bytes=${MAPPING_MAX_UNCOMPRESSED_BYTES:12582912}
app.mapping.start-timeout-sec=${MAPPING_START_TIMEOUT_SEC:45}

# Local diagnostic only. Enables /map-preview.html API; keep false in production.
app.map-preview.enabled=${MAP_PREVIEW_ENABLED:false}

# BE can accept commissioned producer observations; BE does not run the AI model.
app.ai.sensing-enabled=${AI_SENSING_ENABLED:false}

# Main MQTT integration; commissioning unlock is explicit and defaults off.
app.mqtt.allow-commissioning-unlock=${MQTT_ALLOW_COMMISSIONING_UNLOCK:false}
app.mqtt.navigation-profile-sync-enabled=${MQTT_NAVIGATION_PROFILE_SYNC_ENABLED:true}
app.navigation.guidance.announce-distance-cm=${NAV_GUIDANCE_ANNOUNCE_CM:35}
app.navigation.guidance.max-pose-age-ms=${NAV_GUIDANCE_MAX_POSE_AGE_MS:2000}
app.mqtt.publish-rate-per-second=${MQTT_PUBLISH_RATE_PER_SECOND:8}
app.mqtt.publish-queue-capacity=${MQTT_PUBLISH_QUEUE_CAPACITY:64}

# Vietnamese cloud speech. Provider credential stays on BE.
app.tts.enabled=${TTS_ENABLED:false}
app.stt.enabled=${STT_ENABLED:false}
app.stt.openai-api-key=${OPENAI_API_KEY:}
app.stt.model=${OPENAI_TRANSCRIBE_MODEL:gpt-transcribe}
app.tts.openai-api-key=${OPENAI_API_KEY:}
app.tts.voice=${OPENAI_TTS_VOICE:coral}
app.tts.speed=${OPENAI_TTS_SPEED:1.25}
app.tts.model=${OPENAI_TTS_MODEL:gpt-4o-mini-tts}
app.tts.cache-dir=${TTS_CACHE_DIR:./data/speech}

# JDBC owns all session state changes. Avoid repeated reads of autocommit /
# isolation across the cloud link; actual commits/rollbacks remain enabled.
spring.datasource.hikari.data-source-properties.useLocalSessionState=true

# WebRTC: external WSS/TURN TLS; control API uses private VPC/loopback HTTP.
app.media.enabled=${MEDIA_ENABLED:false}
app.media.url=${MEDIA_URL:}
app.media.internal-url=${MEDIA_INTERNAL_URL:http://127.0.0.1:7880}
app.media.api-key=${MEDIA_API_KEY:}
app.media.api-secret=${MEDIA_API_SECRET:}
app.media.token-ttl-sec=${MEDIA_TOKEN_TTL_SEC:60}
app.media.session-max-sec=${MEDIA_SESSION_MAX_SEC:1800}
app.media.ring-timeout-sec=${MEDIA_RING_TIMEOUT_SEC:60}
app.media.device-timeout-sec=${MEDIA_DEVICE_TIMEOUT_SEC:35}

# Delivery email uses Spring SMTP settings (SPRING_MAIL_* environment variables).
app.delivery-email.enabled=${DELIVERY_EMAIL_ENABLED:false}
app.delivery-email.from=${DELIVERY_EMAIL_FROM:}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:10000}
