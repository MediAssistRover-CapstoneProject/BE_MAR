name: MediAssistRover Auto Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: mediassistrover-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: map-schema-ci
          MYSQL_DATABASE: mar_map_schema_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pmap-schema-ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      # ========================================
      # 1. CHECKOUT SOURCE
      # ========================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ========================================
      # 2. SETUP JAVA 21
      # ========================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # ========================================
      # 3. VALIDATE GITHUB VARIABLES
      # ========================================
      - name: Validate deployment variables
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          BUCKET: ${{ vars.MAR_DEPLOY_BUCKET }}
          INSTANCE: ${{ vars.MAR_EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          : "${ROLE_ARN:?Missing AWS_DEPLOY_ROLE_ARN}"
          : "${BUCKET:?Missing MAR_DEPLOY_BUCKET}"
          : "${INSTANCE:?Missing MAR_EC2_INSTANCE_ID}"

          echo "Deployment variables configured"

      # ========================================
      # 4. TEST AGAINST MYSQL AND BUILD SPRING BOOT
      # ========================================
      - name: Test MySQL schema and build Spring Boot JAR
        env:
          MAP_SCHEMA_TEST_JDBC_URL: jdbc:mysql://127.0.0.1:3306/mar_map_schema_test?allowPublicKeyRetrieval=true&useSSL=false
          MAP_SCHEMA_TEST_DB_USER: root
          MAP_SCHEMA_TEST_DB_PASSWORD: map-schema-ci
        run: |
          mvn -B --no-transfer-progress \
            -Dmaven.test.skip=false \
            clean package

          test -s target/backend-0.0.1-SNAPSHOT.jar

          echo "BUILD SUCCESS"

      - name: Validate Flyway migration versions
        shell: bash
        run: |
          python3 - <<'PY'
          from collections import defaultdict
          from pathlib import Path
          import re
          import sys

          migration_dir = Path("src/main/resources/db/migration")
          versions = defaultdict(list)

          for migration in migration_dir.glob("V*__*.sql"):
              match = re.fullmatch(r"V(.+)__.+\.sql", migration.name)
              if match:
                  versions[match.group(1)].append(migration.name)

          duplicates = {
              version: names
              for version, names in versions.items()
              if len(names) > 1
          }

          if duplicates:
              for version, names in sorted(duplicates.items()):
                  print(f"Duplicate Flyway version V{version}: {', '.join(sorted(names))}")
              sys.exit(1)

          print(f"Validated {len(versions)} unique Flyway migration versions")
          PY

      # ========================================
      # 5. DEBUG GITHUB OIDC SUBJECT
      # ========================================
      - name: Check GitHub OIDC Subject
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.request
          import urllib.parse

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]

          separator = "&" if "?" in url else "?"
          url += separator + urllib.parse.urlencode({
              "audience": "sts.amazonaws.com"
          })

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": "Bearer " +
                  os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              }
          )

          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print("================================")
          print("GITHUB OIDC INFORMATION")
          print("================================")

          print("OIDC Issuer:", claims.get("iss"))
          print("OIDC Audience:", claims.get("aud"))
          print("OIDC Subject:", claims.get("sub"))
          print("Repository:", claims.get("repository"))
          print("Git Ref:", claims.get("ref"))

          print("================================")
          PY

      # ========================================
      # 6. AUTHENTICATE AWS WITH OIDC
      # ========================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: GitHubActions-${{ github.run_id }}

      # ========================================
      # 7. VERIFY AWS IDENTITY
      # ========================================
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # ========================================
      # 8. UPLOAD JAR TO PRIVATE S3
      # ========================================
      - name: Upload JAR to S3
        env:
          BUCKET: ${{ vars.MAR_DEPLOY_BUCKET }}
        run: |
          set -euo pipefail

          JAR="target/backend-0.0.1-SNAPSHOT.jar"

          test -s "$JAR"

          sha256sum "$JAR" | awk '{print $1}' \
            > jar.sha256

          aws s3 cp "$JAR" \
            "s3://${BUCKET}/releases/${GITHUB_SHA}.jar" \
            --only-show-errors

          aws s3 cp jar.sha256 \
            "s3://${BUCKET}/releases/${GITHUB_SHA}.sha256" \
            --only-show-errors

          echo "JAR UPLOAD SUCCESS"

      # ========================================
      # 9. DEPLOY TO EC2 USING SSM
      # ========================================
      - name: Deploy to EC2 via SSM
        env:
          BUCKET: ${{ vars.MAR_DEPLOY_BUCKET }}
          INSTANCE: ${{ vars.MAR_EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          CMD=$(cat <<EOF
          bash /usr/local/bin/mar-deploy.sh ${BUCKET} ${GITHUB_SHA} || {
            rc=\$?
            echo "=== DEPLOY DIAGNOSTICS ==="
            echo "--- Deployment script runtime targets ---"
            grep -nE 'systemctl|journalctl|nohup|java|\.log|SERVICE|APP_DIR' /usr/local/bin/mar-deploy.sh || true
            echo "--- Related systemd services ---"
            units=\$(systemctl list-units --type=service --all --no-legend --no-pager | awk 'tolower(\$0) ~ /(mar|mediassist|backend|spring)/ {print \$1}')
            for unit in \$units; do
              systemctl status "\$unit" --no-pager --full || true
              journalctl -u "\$unit" --since "15 minutes ago" --no-pager -o short-iso || true
            done
            echo "--- Spring Boot startup errors from recent journal ---"
            journalctl --since "15 minutes ago" --no-pager -o short-iso \
              | grep -Ei 'APPLICATION FAILED|spring|flyway|hibernate|caused by|exception|error|failed to start|migration|schema-validation' \
              | tail -n 300 || true
            exit \$rc
          }
          EOF
          )


          jq -n --arg command "$CMD" \
            '{commands:[$command]}' > ssm-params.json

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$INSTANCE" \
            --parameters file://ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 90); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE" \
              --query "Status" \
              --output text 2>/dev/null || echo Pending)

            echo "Deployment status: $STATUS"

            case "$STATUS" in

              Success)
                echo "DEPLOY SUCCESS"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE" \
                  --query "StandardOutputContent" \
                  --output text

                exit 0
                ;;

              Failed|TimedOut|Cancelled|Cancelling)

                echo "DEPLOY FAILED"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE" \
                  --output json || true

                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Deployment monitoring timed out"
          exit 1
