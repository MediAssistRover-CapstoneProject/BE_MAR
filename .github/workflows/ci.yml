
name: MediAssistRover Auto Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: mediassistrover-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy source từ GitHub
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Cài Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 3. Chỉ build, bỏ qua toàn bộ test
      - name: Build Spring Boot JAR
        run: |
          mvn -B --no-transfer-progress \
            -Dmaven.test.skip=true clean package

      # 4. Đăng nhập AWS bằng OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      # 5. Upload JAR lên S3 Private
      - name: Upload JAR to S3
        env:
          BUCKET: ${{ vars.MAR_DEPLOY_BUCKET }}
        run: |
          set -euo pipefail

          JAR="target/backend-0.0.1-SNAPSHOT.jar"

          test -s "$JAR"

          sha256sum "$JAR" | awk '{print $1}' \
            > jar.sha256

          aws s3 cp "$JAR" \
            "s3://${BUCKET}/releases/${GITHUB_SHA}.jar"

          aws s3 cp jar.sha256 \
            "s3://${BUCKET}/releases/${GITHUB_SHA}.sha256"

      # 6. Yêu cầu EC2 triển khai tự động
      - name: Deploy to EC2 via SSM
        env:
          BUCKET: ${{ vars.MAR_DEPLOY_BUCKET }}
          INSTANCE: ${{ vars.MAR_EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          CMD="/usr/local/bin/mar-deploy.sh ${BUCKET} ${GITHUB_SHA}"

          jq -n --arg command "$CMD" \
            '{commands:[$command]}' > ssm-params.json

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$INSTANCE" \
            --parameters file://ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          # Theo dõi kết quả thực tế trên EC2
          for i in $(seq 1 90); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE" \
              --query "Status" \
              --output text 2>/dev/null || echo Pending)

            case "$STATUS" in
              Success)
                echo "DEPLOY SUCCESS"
                exit 0
                ;;

              Failed|TimedOut|Cancelled|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE" \
                  --output json || true
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Deployment timeout"
          exit 1
