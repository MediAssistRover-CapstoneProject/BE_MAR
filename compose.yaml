include:
  - compose.simulation.yaml

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-backend_robot_v1}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_USER: ${MYSQL_USER:-mediassist}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: UTC
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-backend_robot_v1}
      DB_USERNAME: ${MYSQL_USER:-mediassist}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      DEVICE_JWT_SECRET: ${DEVICE_JWT_SECRET:?DEVICE_JWT_SECRET is required}
      DEVICE_JWT_EXPIRATION_MS: ${DEVICE_JWT_EXPIRATION_MS:-3600000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_ACCOUNT_CODE: ${ADMIN_ACCOUNT_CODE:-}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      OPERATIONS_SCHEDULER_ENABLED: ${OPERATIONS_SCHEDULER_ENABLED:-true}
      MQTT_ENABLED: ${MQTT_ENABLED:-false}
      MQTT_DISPATCH_ENABLED: ${MQTT_DISPATCH_ENABLED:-false}
      MQTT_BROKER_URI: ${MQTT_BROKER_URI:-ssl://localhost:8883}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-mar-be-mqtt}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_ROBOT_IDS: ${MQTT_ROBOT_IDS:-}
      MQTT_ENABLED_STEP_TYPES: ${MQTT_ENABLED_STEP_TYPES:-MOVE}
      MQTT_ALLOW_COMMISSIONING_UNLOCK: ${MQTT_ALLOW_COMMISSIONING_UNLOCK:-false}
      MQTT_NAVIGATION_PROFILE_SYNC_ENABLED: ${MQTT_NAVIGATION_PROFILE_SYNC_ENABLED:-true}
      MQTT_PUBLISH_RATE_PER_SECOND: ${MQTT_PUBLISH_RATE_PER_SECOND:-8}
      MQTT_PUBLISH_QUEUE_CAPACITY: ${MQTT_PUBLISH_QUEUE_CAPACITY:-64}
      MQTT_ALLOW_SIMULATION: ${MQTT_ALLOW_SIMULATION:-false}
      MAPPING_ENABLED: ${MAPPING_ENABLED:-false}
      AI_SENSING_ENABLED: ${AI_SENSING_ENABLED:-false}
      MAPPING_STORAGE_DIR: /app/data/map-artifacts
      TTS_ENABLED: ${TTS_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TTS_VOICE: ${OPENAI_TTS_VOICE:-coral}
      OPENAI_TTS_SPEED: ${OPENAI_TTS_SPEED:-1.0}
      OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-gpt-4o-mini-tts}
      TTS_CACHE_DIR: /app/data/speech
    volumes:
      - map-artifacts:/app/data/map-artifacts
      - speech-cache:/app/data/speech
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"

  reverse-proxy:
    image: nginx:1.27-alpine
    profiles: ["production"]
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_DIR:-./secrets/tls}:/etc/nginx/tls:ro

volumes:
  speech-cache:
  map-artifacts:
  mysql-data:
